[project]
name = "payops-env"
version = "2.0.0"
description = "PayOps — Payment Operations Incident Response OpenEnv environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "payops_env.server.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["payops_env*"]

[tool.openenv]
name = "payops_env"
type = "space"
app = "payops_env.server.app:app"
