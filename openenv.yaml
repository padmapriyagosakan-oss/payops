spec_version: 1
name: payops_env
display_name: "PayOps — Payment Operations Incident Response"
description: >
  An AI agent acts as a Payment Operations analyst, reviewing financial
  transactions and deciding how to handle each one. Tasks range from
  clear-cut fraud to subtle adversarial patterns like APP scams, insider
  threats, structuring, and KYC violations across 4 difficulty tiers.
type: space
runtime: fastapi
app: payops_env.server.app:app
port: 7860
version: "2.0.0"
author: "PayOps Team"
tags:
  - finance
  - fraud-detection
  - compliance
  - real-world
  - payment-operations

# ── Endpoints (OpenEnv required) ────────────────────────────────────────────
endpoints:
  reset:   POST /reset
  step:    POST /step
  state:   GET  /state
  health:  GET  /health
  schema:  GET  /schema
  tasks:   GET  /tasks
  grader:  GET  /grader
  replay:  POST /replay
  baseline: POST /baseline
  analytics: GET /analytics
  leaderboard: GET /leaderboard

# ── Environment variables required at runtime ────────────────────────────────
env_vars:
  API_BASE_URL:
    description: "OpenAI-compatible API endpoint for LLM inference"
    required: true
    example: "https://api.openai.com/v1"
  MODEL_NAME:
    description: "Model identifier to use for inference"
    required: true
    example: "gpt-4o-mini"
  HF_TOKEN:
    description: "Hugging Face / API key used as Bearer credential"
    required: true
    secret: true

# ── Action space ─────────────────────────────────────────────────────────────
action_space:
  type: discrete
  terminal_actions:
    - approve
    - reject
    - flag
    - escalate
    - hold
  investigation_actions:
    - inspect          # cost: 0.10 budget
    - request_docs     # cost: 0.20 budget
    - verify_kyc       # cost: 0.20 budget
    - contact_sender   # cost: 0.30 budget
    - file_sar         # cost: 0.05 budget

# ── Observation space ─────────────────────────────────────────────────────────
observation_space:
  type: structured
  fields:
    # core transaction
    - transaction_id
    - task_id
    - difficulty
    - amount
    - currency
    - sender
    - receiver
    # risk signals
    - risk_score
    - ml_confidence
    - flags
    - kyc_status
    - kyc_expiry_days
    - velocity_1h
    - velocity_24h
    - country_risk
    - account_age_days
    - previous_sars
    - counterparty_risk
    # investigation reveals
    - inspection_notes
    - docs_notes
    - kyc_notes
    - contact_notes
    # budget
    - budget_remaining
    - action_cost
    # episode progress
    - cumulative_reward
    - chain_step
    - chain_total
    - steps_remaining
    - done
    - reward
    - reward_breakdown
    - recent_decisions
    - network_graph

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:
  count: 20
  difficulties:
    - easy
    - medium
    - hard
    - critical
  difficulty_weights:
    easy: 1.0
    medium: 1.2
    hard: 1.5
    critical: 2.0

# ── Budget ───────────────────────────────────────────────────────────────────
budget:
  initial: 5.0
  overspend_penalty_rate: 0.1

# ── Reward ───────────────────────────────────────────────────────────────────
# Trajectory-based reward (v2): rewards correct intermediate reasoning AND
# the final terminal decision to provide a dense signal.
reward:
  # Terminal-action credit
  terminal_correct: 0.60
  # Investigation eligibility bonus (per eligible sub-action used, first use only)
  investigation_eligible: 0.20
  # Flag-identification bonus (agent used inspect AND task has decisive key_flags)
  flag_identification: 0.20
  # Confidence bonus when agent confidence >= 0.8 and final action is correct
  confidence_correct: 0.10
  confidence_wrong: -0.10
  # Regulatory bonus for SAR filing on regulatory tasks before terminal action
  regulatory_sar: 0.20
  # Duplicate investigation penalty (same sub-action on same task, second+ use)
  duplicate_investigation_penalty: -0.05
  partial_credit: true
  passing_threshold: 0.5
  # Bounds: normalised episode score is strictly clamped to [0.0, 1.0]
  min_score: 0.0
  max_score: 1.0

# ── Inference script ─────────────────────────────────────────────────────────
inference:
  script: inference.py
  max_runtime_seconds: 1200
  requires:
    - API_BASE_URL
    - MODEL_NAME
    - HF_TOKEN

