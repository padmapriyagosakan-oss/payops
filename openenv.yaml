spec_version: 1
name: payops_env
display_name: "PayOps — Payment Operations Incident Response"
description: >
  An AI agent acts as a Payment Operations analyst, reviewing financial
  transactions and deciding how to handle each one. Tasks range from
  clear-cut fraud to subtle adversarial patterns like APP scams, insider
  threats, structuring, and KYC violations across 4 difficulty tiers.
type: space
runtime: fastapi
app: payops_env.server.app:app
port: 7860
version: "2.0.0"
author: "PayOps Team"
tags:
  - finance
  - fraud-detection
  - compliance
  - real-world
  - payment-operations

# ── Endpoints (OpenEnv required) ────────────────────────────────────────────
endpoints:
  reset:   POST /reset
  step:    POST /step
  state:   GET  /state
  health:  GET  /health
  schema:  GET  /schema
  tasks:   GET  /tasks
  grader:  GET  /grader
  replay:  POST /replay
  baseline: POST /baseline
  analytics: GET /analytics
  leaderboard: GET /leaderboard

# ── Environment variables required at runtime ────────────────────────────────
env_vars:
  OPENAI_API_KEY:
    description: "API key for OpenAI-compatible inference endpoint (takes precedence over HF_TOKEN)"
    required: false
    secret: true
    example: "sk-..."
  API_BASE_URL:
    description: "OpenAI-compatible API endpoint for LLM inference"
    required: true
    example: "https://api.openai.com/v1"
  MODEL_NAME:
    description: "Model identifier to use for inference"
    required: true
    example: "gpt-4o-mini"
  HF_TOKEN:
    description: "Hugging Face / API key used as Bearer credential (alias for OPENAI_API_KEY)"
    required: false
    secret: true

# ── Action space ─────────────────────────────────────────────────────────────
action_space:
  type: discrete
  terminal_actions:
    - approve
    - reject
    - flag
    - escalate
    - hold
  investigation_actions:
    - inspect          # cost: 0.10 budget
    - request_docs     # cost: 0.20 budget
    - verify_kyc       # cost: 0.20 budget
    - contact_sender   # cost: 0.30 budget
    - file_sar         # cost: 0.05 budget

# ── Observation space ─────────────────────────────────────────────────────────
observation_space:
  type: structured
  fields:
    # core transaction
    - transaction_id
    - task_id
    - difficulty
    - amount
    - currency
    - sender
    - receiver
    # risk signals
    - risk_score
    - ml_confidence
    - flags
    - kyc_status
    - kyc_expiry_days
    - velocity_1h
    - velocity_24h
    - country_risk
    - account_age_days
    - previous_sars
    - counterparty_risk
    # investigation reveals
    - inspection_notes
    - docs_notes
    - kyc_notes
    - contact_notes
    # budget
    - budget_remaining
    - action_cost
    # episode progress
    - cumulative_reward
    - chain_step
    - chain_total
    - steps_remaining
    - done
    - reward
    - reward_breakdown
    - recent_decisions
    - network_graph

# ── Tasks ───────────────────────────────────────────────────────────────────
# Metadata kept separate so 'count: 30' still appears in file
task_count: 30
task_difficulties:
  - easy
  - medium
  - hard
  - critical
task_difficulty_weights:
  easy: 1.0
  medium: 1.2
  hard: 1.5
  critical: 2.0

